[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vat-finder"
version = "0.1.0"
description = "Agente AI per trovare Partita IVA e Codice Fiscale di aziende italiane"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["vat", "partita-iva", "codice-fiscale", "ai-agent", "claude", "tavily"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
vat-finder = "vat_finder.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/vat-finder"
Repository = "https://github.com/yourusername/vat-finder"
Issues = "https://github.com/yourusername/vat-finder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vat_finder"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=vat_finder"
